[package]
name = "resrap-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser bindings for the resrap-rs generator"
repository = "https://github.com/osdc/Resrap"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
resrap-rs = { git = "https://github.com/osdc/resrap-rs", tag = "v0.2.1" }
serde_json = "1"
wasm-bindgen = "0.2.106"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
